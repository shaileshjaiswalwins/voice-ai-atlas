<meta charset="utf-8">
<title>Voice AI Atlas Atlas</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
:root{
  --paper:#E6DFBE; --paper-2:#DCD4AF; --ink:#17170F; --ink-2:#6E6B54; --rule:#B9B293; --ghost:#8E8A70;
  --hi-bg:#17170F; --hi-fg:#E6DFBE; --face:#EFE9CC; --grid:#CFC8A3;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#1E1D15; --paper-2:#26251B; --ink:#E6DFBE; --ink-2:#A8A388; --rule:#4A4838; --ghost:#6E6B54;
    --hi-bg:#E6DFBE; --hi-fg:#1E1D15; --face:#2A2920; --grid:#33321F;
  }
}
:root[data-theme="dark"]{
  --paper:#1E1D15; --paper-2:#26251B; --ink:#E6DFBE; --ink-2:#A8A388; --rule:#4A4838; --ghost:#6E6B54;
  --hi-bg:#E6DFBE; --hi-fg:#1E1D15; --face:#2A2920; --grid:#33321F;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:var(--mono);font-size:13px;line-height:1.55;overflow:hidden}
#app{display:grid;grid-template-rows:52px 1fr 30px;height:100vh;min-height:600px}
#top{display:flex;align-items:stretch;border-bottom:1.5px solid var(--ink);overflow:hidden}
.stat{padding:6px 14px 4px;border-right:1.5px solid var(--ink);min-width:0;white-space:nowrap}
.stat .k{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
.stat .v{font-size:15px;font-variant-numeric:tabular-nums}
.stat.grow{flex:1;border-right:none;overflow:hidden}
#controls{display:flex;gap:8px;align-items:center;padding:0 14px;border-left:1.5px solid var(--ink)}
button.ctl{font:inherit;font-size:11px;letter-spacing:.06em;text-transform:uppercase;background:var(--paper);color:var(--ink);border:1.5px solid var(--ink);padding:5px 10px;cursor:pointer;box-shadow:2px 2px 0 var(--ink);white-space:nowrap}
button.ctl:hover{background:var(--face)}
button.ctl:active{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--ink)}
button.ctl:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
button.ctl.primary{background:var(--hi-bg);color:var(--hi-fg)}
button.ctl.primary:hover{background:var(--hi-bg);opacity:.9}
button.ctl:disabled{opacity:.4;cursor:default;box-shadow:none}
#main{display:grid;grid-template-columns:232px 1fr 440px;min-height:0}
#index{border-right:1.5px solid var(--ink);overflow-y:auto;padding:10px 8px 20px}
#index h4{font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);margin:12px 4px 6px;font-weight:500}
#index h4:first-child{margin-top:2px}
.ix{display:flex;align-items:flex-start;gap:8px;width:100%;text-align:left;font:inherit;font-size:11.5px;line-height:1.3;background:var(--paper);color:var(--ink);border:1.5px solid var(--ink);padding:7px 8px;margin:0 0 6px;cursor:pointer;box-shadow:2px 2px 0 var(--ink);text-transform:uppercase;letter-spacing:.02em}
.ix .code{color:var(--ink-2);min-width:16px;font-size:10px;padding-top:1px}
.ix .nm{flex:1}
.ix .n{color:var(--ink-2);font-size:10.5px;font-variant-numeric:tabular-nums}
.ix.ghost{border-style:dashed;box-shadow:none;color:var(--ink-2)}
.ix.later{border-color:var(--rule);box-shadow:none;color:var(--ink-2);opacity:.75}
.ix.later .n{font-size:9px;letter-spacing:.06em}
.ix.new{outline:1.5px dashed var(--ink);outline-offset:2px}
.ix.on{background:var(--hi-bg);color:var(--hi-fg)}
.ix.on .code,.ix.on .n{color:var(--hi-fg);opacity:.75}
.ix:hover:not(.on){background:var(--face)}
.ix:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
#canvasWrap{position:relative;min-width:0;background:var(--paper)}
#svg{width:100%;height:100%;display:block;cursor:grab;touch-action:none}
#svg.dragging{cursor:grabbing}
#zoom{position:absolute;right:12px;top:12px;display:flex;flex-direction:column;gap:6px}
#zoom button{width:30px;height:26px;font:inherit;font-size:14px;background:var(--paper);border:1.5px solid var(--ink);color:var(--ink);cursor:pointer;box-shadow:2px 2px 0 var(--ink)}
#rail{position:absolute;left:12px;top:12px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;max-width:calc(100% - 70px)}
#rail .ch{width:22px;height:22px;font:inherit;font-size:10px;background:var(--paper);border:1.5px solid var(--ink);color:var(--ink);cursor:pointer;padding:0;line-height:1}
#rail .ch.done{background:var(--face)}
#rail .ch.on{background:var(--hi-bg);color:var(--hi-fg)}
#rail .ch.locked{border-style:dashed;color:var(--ink-2)}
#rail .ch:focus-visible{outline:2px solid var(--ink);outline-offset:1px}
#rail .title{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);margin-left:6px}
#rail .title b{color:var(--ink);font-weight:500}
#flowSel{position:absolute;left:12px;bottom:12px;display:none;gap:6px}
#flowSel button{font:inherit;font-size:10px;letter-spacing:.08em;text-transform:uppercase;background:var(--paper);border:1.5px solid var(--ink);color:var(--ink);padding:3px 8px;cursor:pointer}
#flowSel button.on{background:var(--hi-bg);color:var(--hi-fg)}
#tip{position:absolute;pointer-events:none;background:var(--hi-bg);color:var(--hi-fg);font-size:11px;padding:4px 8px;max-width:280px;line-height:1.35;display:none;z-index:5}
#panel{border-left:1.5px solid var(--ink);display:flex;flex-direction:column;min-height:0}
#tabs{display:flex;border-bottom:1.5px solid var(--ink)}
#tabs button{flex:1;font:inherit;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;padding:9px 6px;background:var(--paper);color:var(--ink);border:none;border-right:1.5px solid var(--ink);cursor:pointer}
#tabs button:last-child{border-right:none}
#tabs button.on{background:var(--hi-bg);color:var(--hi-fg)}
#tabs button:focus-visible{outline:2px solid var(--ink);outline-offset:-3px}
#body{overflow-y:auto;padding:14px 18px 40px;flex:1}
.eyebrow{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
h1.t{font-size:22px;font-weight:500;line-height:1.2;margin:2px 0 4px;text-wrap:balance}
.lede{font-size:14.5px;line-height:1.5;margin:0 0 14px;max-width:56ch}
.sub{color:var(--ink-2);font-size:11px;margin-bottom:14px}
h3.sec{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);font-weight:500;margin:20px 0 6px;padding-bottom:4px;border-bottom:1.5px solid var(--ink)}
#body p{margin:0 0 12px;max-width:62ch}
#body ul{margin:0 0 12px;padding-left:18px;max-width:62ch}
#body li{margin-bottom:6px}
mark{background:var(--hi-bg);color:var(--hi-fg);padding:0 3px}
.chip{display:inline-block;border:1.5px solid var(--ink);padding:1px 6px;font-size:10px;letter-spacing:.06em;text-transform:uppercase;margin:0 6px 6px 0;background:var(--paper);color:var(--ink);font-family:inherit;cursor:pointer}
.chip.ghost{border-style:dashed;color:var(--ink-2)}
.chip.static{cursor:default}
pre{background:var(--face);border:1.5px solid var(--rule);padding:10px 12px;font-size:11px;line-height:1.45;overflow-x:auto;margin:0 0 12px;white-space:pre}
.step{display:grid;grid-template-columns:24px 1fr;gap:8px;margin:0 0 8px;font-size:12px}
.step .no{color:var(--ink-2);font-variant-numeric:tabular-nums}
.step.cur .no{color:var(--ink);font-weight:600}
.step.cur .tx{background:var(--face);outline:1.5px solid var(--ink);padding:2px 6px}
.actions{display:flex;gap:8px;margin:14px 0 0;flex-wrap:wrap}
.pk{border:1.5px solid var(--ink);padding:10px 12px;margin:0 0 12px}
.pk .lbl{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
.pk .route{font-size:12px;margin:2px 0 8px}
details{border-top:1.5px solid var(--rule);margin:8px 0 0;padding:6px 0 0}
details summary{cursor:pointer;font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2);list-style:none;display:flex;gap:8px;align-items:center}
details summary::before{content:'+';display:inline-block;width:12px;color:var(--ink)}
details[open] summary::before{content:'−'}
details summary::-webkit-details-marker{display:none}
details > *:not(summary){margin-top:8px}
#hint{border-top:1.5px solid var(--ink);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);display:flex;align-items:center;padding:0 14px;gap:14px;overflow:hidden;white-space:nowrap}
.q{padding-left:0;list-style:none}
.q li{position:relative;padding-left:18px}
.q li::before{content:'?';position:absolute;left:0;top:0;color:var(--ink-2)}
.q li.res::before{content:'✓'}
.q li.to::before{content:'→'}
.q li.res>span,.q li.to>span{color:var(--ink-2);text-decoration:line-through;text-decoration-color:var(--rule)}
.q li.to>span{text-decoration:none}
.q .ans{margin-top:2px;padding-left:10px;border-left:1.5px solid var(--ink)}
@keyframes halo{0%{opacity:.9}50%{opacity:.25}100%{opacity:.9}}
.halo{animation:halo 1.6s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.halo{animation:none}}
@media (max-width:1100px){#main{grid-template-columns:200px 1fr 360px}}
</style>

<div id="app">
  <div id="top">
    <div id="stats" style="display:flex;min-width:0;flex:1"></div>
    <div id="controls">
      <button class="ctl" id="btnBack">◂ Back</button>
      <button class="ctl primary" id="btnNext">Next ▸</button>
      <button class="ctl" id="btnFlow">‖ Pause</button>
      <button class="ctl" id="btnStep">Trace one step</button>
      <button class="ctl" id="btnReset">Refit</button>
    </div>
  </div>
  <div id="main">
    <nav id="index" aria-label="Structures"></nav>
    <div id="canvasWrap">
      <svg id="svg" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="currentColor" stroke-width="1.1"/></pattern>
          <pattern id="hatchLight" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)"><line x1="0" y1="0" x2="0" y2="7" stroke="currentColor" stroke-width=".8" opacity=".55"/></pattern>
        </defs>
        <g id="world"></g>
      </svg>
      <div id="rail"></div>

      <div id="zoom"><button id="zin" aria-label="Zoom in">+</button><button id="zout" aria-label="Zoom out">−</button></div>
      <div id="tip"></div>

    <aside id="panel">

  <div id="hint">
    <span>enter / ] next chapter</span><span>[ back</span><span>hover to read</span><span>click to pin</span><span>→ go inside</span><span>← come out</span><span>click a dot to inspect its packet</span>
  </div>
</div>

<script>
const GROUPS = [{"id":"call","title":"The live call"},{"id":"ext","title":"What the call talks to"},{"id":"post","title":"After the call"},{"id":"ops","title":"Watching it"},{"id":"off","title":"Wired but not live today"}];
const NODES = [{"id":"TEL","code":"T","name":"Telephony + LiveKit room","short":"TELEPHONY","group":"ext","gx":1,"gy":1,"w":2.4,"d":2.4,"h":40,"kind":"slab","one":"The phone line — a SIP trunk that dials the buyer and drops the answered call into a LiveKit room.","what":"When a buyer needs qualifying, the dialer places a call. The moment they pick up, the audio becomes a room that a bot can walk into. Everything the atlas shows downstream starts here.","how":"A LiveKit SIP trunk with a dispatch rule bound to <code>agent_name=\"voice-bot-marketplace\"</code>. The room name carries the buyer's mobile (matched out with <code>__(\\d{10,12})_</code>) and the room metadata carries <code>lead_id</code>, <code>assistant_id</code> and <code>call_id</code>. The caller's number and the dialed number are read afterwards from the SIP participant's attributes.","steps":[["Dial","The outbound dialer rings the buyer."],["Answer","A LiveKit room is created; the SIP participant joins."],["Dispatch","The dispatch rule wakes the worker registered under the matching agent name."],["Attributes","The bot reads <code>sip.phoneNumber</code> and the dialed number off the participant once the session is up."]],"cond":[{"q":"Is the SIP trunk config version-controlled anywhere in this repo?","r":"No — it lives on the LiveKit server, outside this branch. The repo only assumes the dispatch rule exists (2026-08-24)."}]},{"id":"MAIN","code":"M","name":"Dispatcher","short":"DISPATCHER","group":"call","gx":5.4,"gy":1,"w":2.4,"d":2.4,"h":58,"kind":"gate","one":"The single worker bound to the phone line — it decides, per call, which bot answers.","what":"One process is registered with the telephony service. Rather than hard-wiring one bot to the line, it looks up the current setting the instant a call lands and hands the call to whichever architecture is configured. That is the reason the system can change its own voice mid-day.","how":"<code>bot_main.py</code>. Registers <code>WorkerOptions(entrypoint_fnc=dispatch_entrypoint, prewarm_fnc=bot_pipeline.prewarm_fnc, agent_name=\"voice-bot-marketplace\", num_idle_processes=3)</code>. Its entrypoint calls <code>load_mode_config()</code> and branches: <code>gemini_live</code> → <code>bot.entrypoint(ctx)</code>; <code>sarvam</code> → <code>bot_pipeline.entrypoint(ctx, SARVAM_PROFILE)</code>; otherwise a <mark>weighted random draw</mark> over the IndicF5 voices, with a second independent draw for <code>nfe_step</code>.","steps":[["Read the switch","Load <code>bot_mode.yaml</code> fresh — no caching, no restart."],["Branch on mode","Three architectures, one line of yaml decides."],["Draw a voice","On <code>own_voice</code>, <code>weighted_pick</code> over anushka/niharika/simran."],["Draw a quality step","A second <code>weighted_pick</code> over <code>nfe_step</code>, so latency-vs-quality is A/B tested in production too."],["Log the choice","One <code>[MODE]</code> line records room, mode, voice_name and nfe_step — the audit trail for the experiment."],["Hand off","Call the chosen entrypoint with the chosen profile."]],"cond":[{"q":"What happens if the yaml is unreadable mid-call-storm?","r":"<code>load_mode_config()</code> catches OSError/YAMLError, logs a warning and falls back to <code>own_voice</code> with the default 50/25/25 weights — calls never fail on a bad edit (2026-08-24)."},"Nothing validates that `num_idle_processes=3` is still the right pool size for current call volume — is it?"]},{"id":"YAML","code":"Y","name":"The live switch","short":"MODE SWITCH","group":"call","gx":5.4,"gy":-3.2,"w":2.2,"d":2.2,"h":26,"kind":"box","one":"A four-line YAML file that is the whole control panel for which bot production runs.","what":"Editing this file changes what the next caller hears. There is no deploy, no restart, no flag service. It also carries a written record of every weight change and the numbers that justified it — the closest thing the system has to a lab notebook.","how":"<code>bot_mode.yaml</code>, read by <code>bot_mode_config.load_mode_config()</code> (override the path with <code>$BOT_MODE_CONFIG</code>). Three keys: <code>mode</code> (<code>gemini_live</code> | <code>sarvam</code> | <code>own_voice</code>), <code>own_voice_weights</code>, <code>nfe_step_weights</code>. <code>_clean_weights()</code> coerces unknown or invalid entries back to defaults and falls back to the full default set if everything sums to zero. Currently <mark>anushka 40 / niharika 40 / simran 20</mark>, <code>nfe_step 8: 100</code>.","steps":[["Edit","Change a number, save."],["Next call","The dispatcher re-reads the file — the change is live."],["Record","The comment block above each block explains why the number is what it is, with dates and z-scores."]],"cond":[{"q":"Why extract the reader into `bot_mode_config.py` rather than leave it in `bot_main.py`?","r":"Because `bot_dev.py` had no reader at all and hard-coded Simran, so dev kept ignoring the weights. One shared module keeps both entrypoints honest (recorded in the module docstring)."},"Simran keeps 20% of traffic while her 69.5% Short Hangup rate is investigated — is that investigation still open, and where is it tracked?","The weight history lives only in YAML comments. If someone reformats the file, the experiment log is gone — should it move somewhere durable?"]},{"id":"PIPE","code":"P","name":"Pipeline session","short":"THE BOT","group":"call","gx":10,"gy":1.6,"w":3.2,"d":3.2,"h":76,"kind":"tall","one":"The bot itself — a five-minute Hindi conversation stitched together from speech-to-text, a language model, and a voice.","what":"This is where the call actually happens. It greets the buyer by name, works through the qualification questions the MIS API returned for their product, notices when they change what they want, notices when it has reached a machine instead of a person, notices when they are winding down, and hangs up gracefully. Most of its two and a half thousand lines are not the conversation — they are the guards around it.","how":"<code>bot_pipeline.py</code>, entrypoint at line 266, seventeen numbered sections. <code>AgentSession(stt, llm, tts, turn_detection=\"stt\")</code>. Business logic is imported wholesale from <code>bot.py</code> (prompt builder, lead fetch, transcript builder, closing/abuse detection, Silero gating) so the two architectures stay behaviourally identical. Hard call cap 300s. Barge-in is suppressed for the first 4 seconds of any reply. A <mark>muted-window capture</mark> subscribes to the raw audio track directly so the caller is still recorded while the bot's own mic is off, then batch-transcribes that window through Sarvam and injects it.","steps":[["1 · Pre-fetch the lead","Fire <code>fetch_lead()</code> before <code>ctx.connect()</code> so the MIS round-trip overlaps room join."],["2 · Resolve config","<code>fetch_bot_config(assistant_id)</code>, falling back to <code>_HARDCODED_BOT_CONFIG</code>. Sets thresholds: silero 0.6, min speech 1000ms, inactivity 4/4/10/5s."],["4 · Build the prompt","Transliterate company/product/option names to Devanagari first, then <code>build_system_prompt()</code> with the persona, the LB1 city flow and the buyer-assist flow."],["5 · Wire the plugins","Sarvam <code>saaras:v3</code> STT → Gemini <code>3.1-flash-lite</code> → IndicF5 or Sarvam <code>bulbul:v3</code> TTS. Pre-synthesize the hold message and the noise nudge."],["7 · Function tools","<code>FetchLead</code> and <code>FetchCategorySchema</code>, the latter guarded by a seller/manufacturer token block and cushioned by a cached \"एक क्षण रुकिए\" hold line."],["9 · Event handlers","<code>user_input_transcribed</code>, <code>agent_state_changed</code>, <code>conversation_item_added</code>, <code>metrics_collected</code> — plus the response watchdogs."],["10 · Muted-window capture","Rolling 5s PCM buffer; frames captured while muted are wrapped as WAV and posted to Sarvam batch STT in <code>codemix</code> mode."],["13 · Greet","A deterministic pre-composed greeting via <code>session.say()</code> — never generated, so the opener can never come out wrong."],["14–15 · Timers","300s hard timeout; a three-strike inactivity ladder capped by <code>_STALL_RESET_CAP = 6</code> so a noisy line cannot loop silently forever."],["Save","Build the transcript, compute duration and average latency, insert one document into MongoDB with <code>tagged: false</code>, delete the room."]],"cond":[{"q":"Why is the greeting spoken rather than generated?","r":"A generated opener was measured as sometimes wrong; a fixed <code>session.say()</code> makes <code>wrong_opener_detected</code> structurally impossible, which is why the pipeline hard-codes it to <code>False</code> in the Mongo doc."},"The `[LLM-WATCHDOG]` cancel/re-inject cycles stack into 10–20s of dead air. `nfe_step=8` was verified *not* to fix it. What does?","Nine watchdog cancel/re-schedule sites touch `_bot_resp_watchdog_task`. Is there a single place that owns its lifecycle, or is that invariant only held by convention?","The entrypoint is one ~2,400-line function with `# noqa: C901`. Which of its seventeen sections could become testable units without changing behaviour?"]},{"id":"VP","code":"V","name":"Voices","short":"VOICES","group":"call","gx":10,"gy":-3.2,"w":2.6,"d":2.6,"h":30,"kind":"cards","one":"Four interchangeable personalities — one Sarvam voice and three of our own — each a small frozen record of everything that differs between them.","what":"Swapping the voice used to mean swapping a whole file. Now a voice is a handful of fields: which engine speaks, which speaker name, what she calls herself, her greeting, and whether her prompt needs the extra Hindi-script coaching. Which one a caller gets is decided by the dice roll in the dispatcher, and recorded on the call so the experiment can be scored later.","how":"<code>voice_profiles.py</code> — a frozen <code>@dataclass VoiceProfile</code>. <code>SARVAM_PROFILE</code> reads Latin script natively and deliberately keeps <code>persona_name=\"Simran\"</code> so the base prompt is left byte-for-byte unchanged. The three <code>INDIC_PROFILES</code> set <code>tts_transliterate=True</code> and carry <code>_TTS_CACHE_HINT</code> plus <code>_TRANSLITERATION_HINT</code>. Each also lists <code>extra_echo_markers</code> (e.g. <code>\"अनुष्का बोल रही\"</code>) so the bot can recognise its own voice bleeding back through the line. <code>voice_name</code> is what gets persisted for A/B scoring.","steps":[["Pick","The dispatcher draws a profile from <code>INDIC_PROFILES</code>."],["Shape the prompt","<code>extra_prompt_hints</code> are appended for IndicF5 voices only."],["Shape the audio","<code>engine</code> selects the TTS plugin; <code>nfe_step</code> is overlaid per call via <code>dataclasses.replace</code>."],["Record","<code>voice_name</code> is written to Mongo and forwarded in the MIS callback."]],"cond":["Three voices are already differentiated in production. Is anyone scoring the `voice_name` field on a schedule, or is it read ad hoc?",{"q":"Why do the IndicF5 profiles need `_TRANSLITERATION_HINT` at all if names are pre-transliterated?","r":"Pre-transliteration only covers company, product and option names from the API. Ordinary Hinglish the LLM invents mid-sentence still needs the standing rule (2026-08-24)."}]},{"id":"STT","code":"S","name":"Sarvam speech-to-text","short":"HEARING","group":"ext","gx":14.6,"gy":-1.4,"w":2.2,"d":2.2,"h":34,"kind":"slab","one":"Turns the caller's Hindi into text, twice over — live during the call, and in batches for the moments the bot was talking.","what":"Hearing is used in two modes. Streaming, for the ordinary back-and-forth. And in batch, for the seconds when the bot had its own microphone switched off and would otherwise have missed the caller cutting in.","how":"<code>sarvam.STT(language=\"hi-IN\", model=\"saaras:v3\", mode=\"transcribe\", flush_signal=True)</code> for the live stream, with Sarvam owning turn detection. The muted window posts a hand-built WAV to <code>https://api.sarvam.ai/speech-to-text</code> with <code>mode=codemix</code> and a 10s timeout. Final live transcriptions are gated by Silero (<code>_silero_voiced_ms</code>, threshold 0.6, min 1000ms) against a rolling 5-second PCM window — <mark>rolling, not fill-then-drop</mark>, because the mic unmutes 4s into a 10s bot turn and a fixed buffer filled with the bot's own echo starved the gate.","steps":[["Stream","Frames flow while the mic is enabled."],["Gate","A final transcription is checked against the Silero voiced-ms window before it counts as a turn."],["Buffer","While muted, raw frames accumulate separately."],["Batch","On unmute, the muted window is WAV-wrapped and transcribed, then injected as a turn."]],"cond":["The muted-window path builds a fresh `aiohttp.ClientSession` per transcription rather than reusing the shared one — deliberate, or drift?"]},{"id":"LLM","code":"L","name":"Gemini","short":"THINKING","group":"ext","gx":14.6,"gy":2.8,"w":2.2,"d":2.2,"h":34,"kind":"slab","one":"The language model that carries the conversation, transliterates names, and later reads the whole call back.","what":"The same family of model does three different jobs here, deliberately kept apart: one holds the conversation, one does nothing but convert English words into Hindi script, and one reads the finished transcript and decides what the call was worth. Splitting them was a measured decision, not a stylistic one.","how":"Conversation: <code>google.LLM(model=\"gemini-3.1-flash-lite\", temperature=0.4)</code>. Transliteration: <code>gemini-3.1-flash-lite-preview</code>, a narrow single-purpose call cached in <code>_TRANSLIT_CACHE</code>. Analysis: <code>gemini-3.1-flash-lite</code> in the callback worker. The Gemini Live path additionally load-balances a key pool — <code>_next_gemini_key()</code> picks the least-inflight key, round-robins among ties, and <mark>quarantines a key for 60s on a 409</mark>, falling back to the soonest-to-recover key rather than failing the call.","steps":[["Prompt","A Hindi system prompt built per lead, with per-question phrasing rules and a mandatory 2–4 word opening acknowledgement so the first TTS chunk plays in ~100ms."],["Turn","One generation per user turn, with watchdogs re-injecting if no response arrives."],["Tools","Two function tools it may call mid-conversation."],["Analyse","Later, offline, a separate call reads the whole transcript against the disposition rubric."]],"cond":["Key rotation and 409 cooldown live only in `bot.py` (the Gemini Live path). The live pipeline uses a single `GEMINI_API_KEY` — does it need the same protection at current volume?","The \"start every reply with a 2–4 word acknowledgement\" rule buys perceived latency. Has anyone measured whether it also costs a turn of quality?"]},{"id":"TTS","code":"F","name":"IndicF5 voice server","short":"SPEAKING","group":"ext","gx":14.6,"gy":7,"w":2.2,"d":2.2,"h":34,"kind":"slab","one":"Our own Hindi voice, synthesised on our own hardware over a websocket.","what":"The three named voices are not a vendor product — they are fine-tuned models running on a box we own. That is why the quality-versus-speed dial is ours to turn, and why the plugin has to cope with a voice occasionally refusing to speak a line.","how":"<code>livekit_indic5_tts.IndicF5TTS</code>, a non-streaming <code>tts.TTS</code> talking to <code>ws://tts.internal:8404/ws</code> at 24kHz. Options carried per call: <code>nfe_step</code>, <code>speaker</code>, <code>transliterate</code>, <code>speed</code>, <code>style</code>. Some fine-tuned speakers intermittently return <code>{\"event\":\"end\",\"sentences\":0,\"suppressed\":true}</code> with <mark>zero audio and no error</mark> — the plugin retries once with <code>fallback_speaker</code> so a suppressed line never becomes dead air on a live call.","steps":[["Synthesize","One websocket request per utterance — this TTS does not stream."],["Detect suppression","Zero frames plus <code>suppressed: true</code> is a silent failure, not an error."],["Retry","Re-request once as <code>fallback_speaker</code> (default simran), unless that is already the speaker."],["Cache the canned lines","The hold message and noise nudge are pre-synthesized once and replayed from frames."]],"cond":["How often does the suppression fallback actually fire, and is it counted anywhere?","The server address is a bare LAN IP with no health check in the bot. What does a call do if the box is down when the greeting is due?"]},{"id":"MIS","code":"A","name":"MIS lead API","short":"MIS API","group":"ext","gx":5.4,"gy":6.6,"w":2.4,"d":2.4,"h":34,"kind":"slab","one":"the marketplace's system of record — where the buyer, their product, and the questions to ask them all come from, and where the verdict goes back.","what":"The bot does not invent what to ask. Every call is shaped by a lead record fetched at the start: who the buyer is, what they searched for, and the list of specification questions their product category demands. When the call is over and analysed, the answers travel back to the same system.","how":"<code>http://mis-api.internal:8000</code>. Read: <code>fetch_lead(lead_id | mobile)</code> and <code>/leads/ai-lead-qualify/search</code> for a mid-call product change. Write: <code>/leads/ai-lead-qualify/callback</code> and <code>/callback-update</code>. The question set arrives as <code>results.search_result.question</code> and is stored on the lead as <code>qualification_schema[\"question\"]</code>. Note the bot asks <mark>more than the schema lists</mark> — product confirmation, business name and city are hard-coded extra steps, by design.","steps":[["Pre-fetch","Kicked off before room connect so the round-trip overlaps join."],["Log the questions","Every question the backend returned is logged verbatim per call."],["Re-fetch on change","<code>FetchCategorySchema</code> swaps the whole question set mid-call when the buyer changes product."],["Callback","The analysed outcome is posted back after the call, with up to four `spec_ques_N` entries."]],"cond":[{"q":"Why does the total number of asks exceed the backend question count?","r":"By design — the BUSINESS GATE adds product confirmation, business name and city on top of the schema questions (noted inline in `bot_pipeline.py`)."},"`MIS_API_BASE` is a hard-coded LAN IP that `bot_pipeline.py` re-declares after importing it from `bot.py` — is the dev/live override still intentional?"]},{"id":"MONGO","code":"D","name":"Call transcripts","short":"TRANSCRIPTS","group":"post","gx":10,"gy":7.4,"w":2.8,"d":2.8,"h":26,"kind":"store","one":"One document per call, and the handoff point between the bot and everything that happens afterwards.","what":"The bot never talks to the analysis step directly. It writes down what happened and marks the document unread; something else picks it up later. That one flag is the entire coordination mechanism, and it is what makes a failed callback safe to retry.","how":"<code>mongodb://mongo.internal:27017</code>, db <code>ai_lead_qualify</code>, collection <code>call_transcripts</code>. The document carries <code>transcript</code>, <code>muted_transcript</code>, the full <code>lead_record</code>, <code>sip_info</code>, timings, <code>turn_count</code>, <code>avg_response_latency_ms</code>, per-call <code>voice_name</code> and <code>nfe_step</code>, and the flags analysis depends on: <code>greeting_done</code>, <code>user_speech_ms</code>, <code>wrong_opener_detected</code>, <code>gemini_connect_failed</code>. It is inserted with <mark><code>tagged: false</code></mark>. A compound index on <code>(tagged, created_at)</code> is created at worker startup.","steps":[["Insert","One document at call end, always <code>tagged: false</code>."],["Claim","The worker finds untagged docs, oldest first."],["Enrich","The analysis block is written back before any callback is attempted."],["Tag","<code>tagged: true</code> only once the callback has been accepted."]],"cond":["There is no lease or claim marker — only `tagged`. Two worker instances would analyse the same document twice. Is single-instance an enforced deployment constraint or an assumption?","Documents skipped for `no_lead_id` or `fallback_lead_id` are tagged with a `skipped_reason` and never revisited. Is anyone reading that field?"]},{"id":"CBW","code":"W","name":"Callback worker","short":"THE READER","group":"post","gx":5.4,"gy":11.8,"w":2.6,"d":2.6,"h":52,"kind":"job","one":"A patient loop that wakes every minute, reads the calls nobody has read yet, and decides what each one was worth.","what":"Everything commercially meaningful about a call is decided here, minutes after the caller hung up: whether they were interested, whether they answered enough to count, how big the deal might be. The bot only listens; this is what judges.","how":"<code>callback_worker/worker.py</code>. Polls every <code>POLL_INTERVAL_SEC=60</code> for up to <code>BATCH_LIMIT=50</code> untagged documents and processes them one at a time. Blocking pymongo calls are pushed through <code>run_in_executor</code>. SIGTERM and SIGINT set a stop event so the <mark>current batch finishes before exit</mark>. On analysis failure it falls back to <code>fallback_analysis(status)</code> rather than losing the document; on callback failure it leaves the document untagged to retry next tick.","steps":[["Tick","Find <code>{tagged: false}</code>, limit 50."],["Guard","Skip and permanently tag docs with no <code>lead_id</code> or a <code>fallback_</code> one."],["Analyse","<code>generate_call_analysis()</code> with the transcript, the muted transcript, duration, greeting flag, speech-ms, and the buyer's business/city/lead-bank flags."],["Score, or skip","B2B scoring runs only if the outcome is not in <code>B2B_SCORE_SKIP_OUTCOMES</code>."],["Persist first","Write the analysis block to the document *before* attempting the callback, so a retry never re-pays the LLM."],["Send","Build and post the callback; tag the document only on success."]],"cond":["Documents are processed strictly sequentially inside a tick. At 50 docs and two LLM calls each, how long is a worst-case tick, and does it ever exceed the 60s poll interval?",{"q":"Why is B2B scoring sequential rather than gathered in parallel with the analysis?","r":"Because the skip decision depends on the outcome the analysis produces — gathering them would pay for scores that are thrown away (cost cut, 2026-07-22)."},"A permanently-failing callback keeps a document untagged forever and it is retried every minute indefinitely. Should there be an attempt count?"]},{"id":"AN","code":"N","name":"Disposition rubric","short":"THE RUBRIC","group":"post","gx":10,"gy":13,"w":2.8,"d":2.8,"h":44,"kind":"cards","one":"A twenty-outcome vocabulary for what a phone call can mean, and the rules for telling them apart.","what":"The hard part is not summarising the call — it is drawing lines. Someone who said \"hello\" and hung up is a different outcome from someone who said they are not interested, which is different again from someone who wants the product but will source it themselves. Most of this file exists to keep those lines from blurring, and much of it never reaches the model at all: whole classes of call are decided deterministically before any LLM is asked.","how":"<code>callback_worker/analysis.py</code>, 3,411 lines and effectively two functions. <code>DISPOSITION_MAP</code> holds 20 outcomes with a prose definition each — the distinction between <code>Approved</code>, <code>Enriched</code> and <code>Interested</code> turns entirely on how many specification questions got a genuine on-topic reply, where <mark>an honest \"not sure\" counts as answered</mark>. Deterministic short-circuits come first: <code>gemini_connect_failed</code> → Technical Issue; empty transcript → Short Hangup. <code>_BARE_CALL_SIGNAL_TOKENS</code> is a large NFC-normalised set of phone-answering reflexes (\"हेलो\", \"haan bolo\", \"ठीक है\", \"ओम\") — if every word the caller said is in that set, the call is a Short Hangup without asking the model. Text is normalised by Unicode category (L/M/N) rather than <code>\\w</code>, because <code>\\w</code> strips Devanagari vowel marks and turns हेलो into हल.","steps":[["Short-circuit","Connection failure, empty transcript, or nothing but call-answering reflexes — decided without an LLM."],["Classify","One Gemini call against the 20-entry rubric, returning outcome, summary, business fields, and per-question answers."],["Extract Q&A","Answers are matched back onto the original English schema question IDs."],["Score B2B","<code>generate_b2b_score</code> runs a 10-point rubric: requirement intent (0–5), clarity (0–3.5), and urgency — but only for outcomes where a deal value means anything."]],"cond":["Two functions across 3.4k lines, mostly prompt text. Is the rubric prompt versioned anywhere against outcome-quality measurements?","The bare-signal token set is hand-curated across five scripts and several regional greetings. What is the process when a new false Short Hangup is spotted?",{"q":"Why normalise by Unicode category instead of `\\w`?","r":"Devanagari vowels are combining marks (category Mn) and `\\w` drops them, corrupting every match — the fix keeps categories L, M and N (recorded in the function docstring)."}]},{"id":"CITY","code":"C","name":"City mapper","short":"CITY MAPPER","group":"post","gx":14.2,"gy":12.6,"w":2.2,"d":2.2,"h":28,"kind":"box","one":"Matches whatever city the buyer said onto the marketplace's fixed list — without ever overwriting what they actually said.","what":"Buyers say city names in Hindi, in English, misspelled, or name a town that is not on the list at all. Downstream systems need one of a fixed set of names. So the raw answer and the tidy answer are kept as two separate fields, permanently — you can always see what the person really said.","how":"<code>callback_worker/city_mapper.py</code> against <code>data/city_list.json</code>. An exact or close variant maps to that entry; a city absent from the list maps to the <mark>geographically closest</mark> entry. <code>up_usr_city</code> is never altered; <code>mapped_city</code> is an additional field. Both travel in the callback payload.","steps":[["Collect","The bot records whatever the buyer said as <code>up_usr_city</code>."],["Match","LLM-match against the fixed list."],["Fall back","Not on the list → nearest listed city."],["Emit","Both fields go to MIS, side by side."]],"cond":["A geographic-nearest fallback can produce a confidently wrong city for an unlisted town. Is `mapped_city` ever shown to a seller as if it were confirmed?"]},{"id":"CB","code":"B","name":"Callback payload","short":"THE VERDICT","group":"post","gx":1,"gy":11.8,"w":2.6,"d":2.6,"h":36,"kind":"box","one":"Folds the whole call down into one flat record MIS can act on — and quietly repairs what speech-to-text mangled.","what":"This is the last chance to fix a call. If speech recognition dropped a digit and turned \"140 GSM\" into \"40 GSM\", it is corrected here by matching against the options the question actually offered. If a buyer gave a bare number where a quantity was wanted, a unit is attached — unless they quoted a rupee value, in which case attaching \"units\" would misreport money as a count.","how":"<code>callback_worker/callback.py::build_callback_payload</code>. <code>fuzzy_match_opt_id</code> patches null <code>opt_id</code>s. Quantity answers get a unit appended only when the answer is a bare number with no unit word at all — currency answers (<code>_CURRENCY_RE</code>) and any answer already carrying a real unit are left alone. At most <mark>four <code>spec_ques_N</code> slots</mark>: three ordinary questions plus one quantity, and for lead-bank-1 leads the confirmed city takes slot one. A call marked <code>disconnected</code> that analysis resolved as Approved or Enriched is upgraded to <code>completed</code>. Everything is stamped <code>ai_partner: \"ai-partner-bot\"</code>.","steps":[["Repair","Fuzzy-match missing option IDs against the schema options."],["Unit-fix","Append a unit only to a bare number, never to a currency amount."],["Rank","Pick at most four spec slots, quantity guaranteed one of them."],["Lead a city","For LB1 leads, prepend the confirmed city as <code>spec_ques_1</code>."],["Post","<code>send_callback</code> to <code>/leads/ai-lead-qualify/callback</code>; success is what tags the document."]],"cond":["Only four spec slots survive. Which questions get dropped when a category asks six, and does anyone see what was lost?",{"q":"Why upgrade `disconnected` to `completed` on a positive outcome?","r":"Because the buyer did qualify before the line dropped — reporting it as a disconnect would lose a real lead (inline note in `callback.py`)."}]},{"id":"OPS","code":"O","name":"Audit scripts","short":"AUDIT","group":"ops","gx":1,"gy":16,"w":2.6,"d":2.6,"h":32,"kind":"job","one":"A small set of hand-run scripts for the question \"did we judge these calls correctly?\"","what":"The analysis step is a model reading a transcript, so it can drift. These scripts exist to catch that: re-score a day's calls several times and see whether the answer holds, pull the ones where the stored verdict disagrees with what MIS has, or dump a single call's logs and transcript side by side to work out what went wrong.","how":"<code>audit_outcome_drift.py</code> paginates MIS for a date, joins to Mongo by <code>lead_id</code>, re-runs <code>generate_call_analysis</code> N times, takes a <mark>majority vote</mark>, and flags disagreements — strictly read-only, no callbacks, no writes. <code>fetch_anomalies_debug.py</code> dumps mismatches to JSON for hand analysis. <code>check_outcomes_today.py</code> lists the day's positive outcomes. <code>fetch_lead_debug.py</code> pulls logs plus transcript for named lead IDs. <code>reprocess_callbacks.py</code> is the one that writes: a one-off corrective re-analysis and re-send.","steps":[["Pull","Every MIS lead for a date, connected and not."],["Join","Match to the Mongo transcript by <code>lead_id</code>."],["Re-score","Re-run analysis N times; majority vote is the new answer."],["Flag","Old outcome ≠ new outcome → anomaly row in the CSV."],["Correct","Separately and deliberately, <code>reprocess_callbacks.py</code> re-sends fixed verdicts."]],"cond":["These are all run by hand. Should drift auditing be a scheduled job with an alert threshold?","`fetch_lead_debug.py` carries a hard-coded `LEAD_IDS` list as its default — a leftover from a specific investigation?"]},{"id":"GEM","code":"G","name":"Gemini Live bot","short":"GEMINI LIVE","group":"off","ghost":true,"gx":10,"gy":-7.6,"w":3,"d":3,"h":60,"kind":"tall","one":"The speech-to-speech architecture — one model doing hearing, thinking and speaking at once. Runnable today, but not what production runs.","what":"The original design: no separate transcription or voice step, just a model that listens and talks. It is still fully wired and one line of YAML away, and it remains the library the live pipeline imports nearly all its business logic from — so it is not dead code in any sense, just not the voice on the line right now.","how":"<code>bot.py</code>, 4,660 lines — the largest file and the shared foundation. Gemini Live via <code>livekit.plugins.google.realtime.RealtimeModel</code>. It owns the pool of Gemini keys with inflight-aware selection and 409 quarantine, the deterministic transliteration cache, the Hindi number-to-words conversion, <code>build_system_prompt</code>, and every detection helper the pipeline imports. Its known constraint: the realtime model <mark>cannot <code>generate_reply()</code> or update instructions mid-session</mark>, so greetings, nudges and timeout lines are pre-composed strings.","steps":[["Select a key","Least-inflight, round-robin among ties, skipping any in 409 cooldown."],["Connect","Realtime websocket session; a failure here is recorded as <code>gemini_connect_failed</code> and becomes a Technical Issue outcome."],["Speak","Pre-composed localized strings only — the model cannot be re-instructed mid-call."],["Save","The same Mongo document shape as the pipeline, so the callback worker cannot tell them apart."]],"cond":["The live pipeline imports ~25 symbols from `bot.py`, including private ones. Should the shared library be extracted so the inactive architecture is not load-bearing?","If `bot.py` is the fallback, when was `mode: gemini_live` last exercised end-to-end on the live trunk?"]},{"id":"SOLO","code":"R","name":"Standalone voice workers","short":"FALLBACKS","group":"off","ghost":true,"gx":14.6,"gy":-7.6,"w":2.4,"d":2.4,"h":30,"kind":"cards","one":"Three near-identical per-voice workers kept runnable under their own agent names, as an escape hatch from the dispatcher.","what":"Before the dispatcher existed, each voice was its own file and its own process. Those files are still here and still start, so if the dispatcher itself were the problem you could pin traffic to one known voice in a moment. The cost is that the same two and a half thousand lines exist four times over.","how":"<code>bot_anushka.py</code>, <code>bot_niharika.py</code>, <code>bot_simran.py</code> with <code>start_*.sh</code> each. Measured against each other they differ by <mark>23–24 lines</mark> — the voice configuration and nothing else; against <code>bot_pipeline.py</code>, 724. <code>bot_dev.py</code> is a genuine fork of <code>bot.py</code> (5,652 lines differ) carrying the hot-lead location-confirm and PIN-code flow, marked on its Mongo documents as <code>hotlead_pincode_flow_enabled</code> so analysis can tell dev calls from live ones.","steps":[["Start","<code>./start_anushka.sh</code> — own port, own agent name."],["Diverge","Any fix to the pipeline has to be copied into three files, or it silently is not."]],"cond":["The three persona files differ from each other by ~24 lines. Now that `voice_profiles.py` exists, is there a reason to keep them rather than script the dispatcher with a pinned profile?","A pipeline fix landing in `bot_pipeline.py` does not reach the three fallbacks. How would anyone notice the drift before the fallback is needed?"]}];

const CH = [{"id":"ring","title":"A call is answered","reveal":["TEL","MAIN"],"lede":"Strip everything away and this is the system: a phone is answered, and one process decides what happens next.","story":"<p>The dialer rings a buyer who posted a requirement on the marketplace. The instant they pick up, the call becomes a LiveKit room and a dispatch rule wakes exactly one worker.</p><p>That worker is not a bot. It is <mark>a decision about which bot</mark> — and it makes that decision fresh, for every single call.</p>","flow":[["TEL","MAIN","call answered",{"room":"jd__9876543210_a41f","lead_id":"LD-88213"}]]},{"id":"switch","title":"The switch on the wall","reveal":["YAML","VP"],"lede":"A four-line YAML file decides which architecture — and which voice — answers the next caller.","story":"<p>Most systems change behaviour by deploying. This one changes behaviour by saving a file. <code>bot_mode.yaml</code> is re-read on <mark>every incoming call</mark>, so editing a weight at 3pm changes what the 3:00:01pm caller hears.</p><p>Three voices split today's traffic 40/40/20, and each call records which one spoke it. That makes the split a live A/B test, and the comments in the YAML the lab notebook.</p>","flow":[["MAIN","YAML","read the switch",{"path":"bot_mode.yaml"}],["YAML","MAIN","mode + weights",{"mode":"own_voice","anushka":40,"niharika":40,"simran":20}],["MAIN","VP","weighted pick",{"drew":"niharika","nfe_step":8}]]},{"id":"listen","title":"Listening and thinking","reveal":["PIPE","STT","LLM"],"lede":"The bot proper: hearing turned into text, text turned into a Hindi reply.","story":"<p>The live architecture is a three-stage pipeline, not a single speech-to-speech model. Sarvam transcribes, Gemini answers, and a great deal of code sits between them deciding what counts as the caller actually speaking.</p><p>The subtle part is the <mark>muted window</mark>: the bot's own microphone is off while it talks, so it subscribes to the raw audio track separately and batch nd marks it unread. That flag is the entire handoff.","story":"<p>There is no queue and no message bus between the call and its analysis — just a document with <code>tagged: false</code>. Something else will pick it up within the minute.</p><p>It is a deliberately dull mechanism, and it buys the thing that matters: a failed callback simply <mark>stays unread and is retried</mark>, with no risk of losing a call.</p>","flow":[["PIPE","MONGO","save transcript",{"tagged":false,"voice_name":"marketplace-niharika","turn_count":11,"call_duration_sec":96.4}]]},{"id":"read","title":"Reading the call back","reveal":["CBW","AN"],"lede":"A minute later, something reads the transcript and decides what the call was actually worth.","story":"<p>Everything commercially meaningful is decided here, not during the call. Twenty possible outcomes, separated mostly by how many specification questions got a genuine reply — where <mark>an honest \"not sure\" counts as answered</mark>, because the buyer engaged.</p><p>Much of it never reaches a model. A caller who only said \"हेलो\" is a Short Hangup by lookup, decided before any LLM is asked, and B2B scoring is skipped entirely for the eight outcomes where a deal value would be meaningless.</p>","flow":[["CBW","MONGO","claim untagged",{"limit":50}],["MONGO","CBW","one call",{"lead_id":"LD-88213","turns":11}],["CBW","AN","analyse",{"greeting_done":true,"user_speech_ms":8210}],["AN","CBW","classified",{"call_outcome":"Enriched","answered":"2 of 3"}]]},{"id":"verdict","title":"Sending the verdict home","reveal":["CITY","CB"],"lede":"The last chance to repair a call before it becomes a record someone acts on.","story":"<p>Speech recognition drops digits. \"140 GSM\" arrives as \"40 GSM\", so the answer is fuzzy-matched back against the options the question actually offered. A bare number gets a unit attached — unless it was a rupee amount, where \"1000 units\" would be a <mark>lie about money</mark>.</p><p>The city gets the same care: what the const HOW_HTML = "<div class=\"eyebrow\">voice-ai-atlas · anonymized case study</div>\n<h1 class=\"t\">How it's built</h1>\n<div class=\"sub\">the shape, and what sits around it</div>\n\n<h3 class=\"sec\">The shape in one line</h3>\n<p>One LiveKit worker, three interchangeable conversation architectures selected per call by a YAML file, and a polling worker that reads every finished call back with an LLM and reports a verdict to the marketplace's MIS.</p>\n\n<h3 class=\"sec\">What the platform gives us</h3>\n<p>LiveKit Agents provides the worker lifecycle, room join, SIP participant attributes, the <code>AgentSession</code> STT/LLM/TTS wiring, turn detection, barge-in plumbing, prewarm and idle-process pooling, and the <code>function_tool</code> decorator.</p>\n\n<h3 class=\"sec\">What we own</h3>\n<p>Everything about the conversation: the Hindi system prompt builder, the per-call mode dispatch, the IndicF5 websocket TTS plugin, muted-window capture and batch re-transcription, the response watchdogs, IVR and voicemail detection, closing-phrase and abuse detection, the entire twenty-outcome analysis rubric, and the MIS callback payload shape.</p>\n\n<h3 class=\"sec\">Scope of this atlas</h3>\n<p>This covers the voice runtime only — roughly 23,000 lines of Python across 23 files: the telephony dispatcher, the three conversation architectures, and the post-call analysis worker. The wider platform it lived beside — a FastAPI backend, a React no-code bot builder, and the campaign-dialer and alert workers — is <mark>not drawn here</mark>. Company name and internal endpoints are placeholders; everything structural is as it ran.</p>\n\n<h3 class=\"sec\">Filesystem</h3>\n<pre>bot_main.py            # live dispatcher — worker bound to agent_name \"voice-bot-marketplace\"\nbot_mode.yaml          # the live switch, re-read on EVERY call\nbot_mode_config.py     # shared reader/picker for the yaml\nbot_pipeline.py        # STT -> LLM -> TTS session (the live path, 2,769 lines)\nbot.py                 # Gemini Live s2s + the shared helper library (4,660 lines)\nbot_dev.py             # dev fork of bot.py (hot-lead pincode flow)\nbot_anushka|niharika|simran.py   # standalone per-voice fallback workers\nvoice_profiles.py      # VoiceProfile dataclass + the four profiles\nlivekit_indic5_tts.py  # IndicF5 websocket TTS plugin for LiveKit\ncallback_worker/\n  worker.py            # 60s poll over untagged transcripts\n  analysis.py          # disposition rubric + B2B scoring (3,411 lines)\n  callback.py          # MIS callback payload builder + sender\n  city_mapper.py       # freeform city -> the marketplace's fixed city list\n  config.py            # Mongo / callback URLs / poll cadence\n  data/city_list.json\naudit_outcome_drift.py # read-only outcome re-scoring audit\nreprocess_callbacks.py # one-off corrective re-analysis + re-send\ncheck_outcomes_today.py, fetch_lead_debug.py, fetch_anomalies_debug.py</pre>\n\n<h3 class=\"sec\">Endpoints this branch assumes</h3>\n<pre>MIS API        http://mis-api.internal:8000\nMongoDB        mongodb://mongo.internal:27017  (ai_lead_qualify.call_transcripts)\nIndicF5 TTS    ws://tts.internal:8404/ws\nSarvam STT     https://api.sarvam.ai/speech-to-text</pre>";
const DECISIONS_HTML = "<li><b>Mode switching.</b> <code>bot_mode.yaml</code> is read fresh on every incoming call, never cached — changing architecture or voice weights takes effect on the next call with no worker restart</li><li><b>Live architecture.</b> <code>own_voice</code> — the Sarvam-STT → Gemini-LLM → IndicF5-TTS pipeline, not Gemini Live s2s. Gemini Live and the Sarvam voice stay wired and runnable as fallbacks</li><li><b>Voice split.</b> anushka 40 / niharika 40 / simran 20, set 2026-07-25. Niharika equal-weighted with Anushka on a 4-day Enriched trend despite a much shorter track record — recorded in the yaml as a deliberate bet, not a data-driven one</li><li><b>TTS quality knob.</b> <code>nfe_step</code> pinned to 8 for 100% of calls (2026-07-22) to shave latency — with a verified note that this will *not* fix the 10–20s dead-air gaps, which are LLM thinking plus watchdog re-inject loops</li><li><b>Transliteration.</b> Company, product and option names are transliterated to Devanagari by a narrow single-purpose LLM call before prompt build, never by the live conversational LLM (~41–43% Latin-leak measured, 2026-07-23/24)</li><li><b>Question text.</b> A qualification question's <code>text</code> is *translated* into natural Hindi by the live LLM; only its option labels are mechanically transliterated. The original English schema is what persists to Mongo and what analysis matches against</li><li><b>Analysis cost.</b> B2B scoring is skipped entirely for the 8 terminal/negative outcomes in <code>B2B_SCORE_SKIP_OUTCOMES</code>, sequentially after the outcome is known rather than gathered in parallel (2026-07-22)</li><li><b>Durability.</b> Analysis is persisted to the transcript document *before* the callback is attempted, so a failed callback retries on the next tick without re-paying for the LLM</li><li><b>City handling.</b> <code>up_usr_city</code> keeps exactly what the buyer said, forever. <code>mapped_city</code> is a separate additional field holding the LLM's best match against <code>data/city_list.json</code></li>";

function bendFor(a,b){ const t=FLOWS[0].hops.find(h=>h[0]===a&&h[1]===b)||FLOWS[1].hops.find(h=>h[0]===a&&h[1]===b); return t?(t[4]||'xy'):'yx'; }
function buildInsideScene(n){

}
function hopPath(h){
  const A=sceneNodes.find(n=>n.id===h.from), B=sceneNodes.find(n=>n.id===h.to); if(!A||!B) return null;
  const [ax,ay]=center(A), [bx,by]=center(B); const mid = h.bend==='xy' ? [bx,ay] : [ax,by];
  const g=[[ax,ay],mid,[bx,by]].filter((p,i,arr)=>i===0||p[0]!==arr[i-1][0]||p[1]!==arr[i-1][1]);
  const scr=g.map(p=>P(p[0],p[1],0)); let len=0; const seg=[]; for(let i=1;i<scr.length;i++){const l=Math.hypot(scr[i][0]-scr[i-1][0],scr[i][1]-scr[i-1][1]);seg.push(l);len+=l;}

}
function pointAt(path,t){ let d=t*path.len; for(let i=0;i<path.seg.length;i++){ if(d<=path.seg[i]||i===path.seg.length-1){const u=path.seg[i]?Math.min(1,d/path.seg[i]):1;const a=path.scr[i],b=path.scr[i+1];return [a[0]+(b[0]-a[0])*u,a[1]+(b[1]-a[1])*u];} d-=path.seg[i]; } return path.scr[0]; }

function drawNode(n){
  const g=el('g',{class:'node',style:'cursor:pointer','data-id':n.id});
  const {gx,gy,w,d,h}=n; const sel=S.selected===n.id, hov=S.hover===n.id, fresh=!n.inside&&isNew(n.id);
  const sw=sel?2:1.2, dash=n.ghost?'4 3':null, face=n.ghost?'none':'var(--face)';
  const face3=(p,fill,hatch,extra={})=>{const poly=el('polygon',{points:pts(p),fill:fill,stroke:'var(--ink)','stroke-width':sw,'stroke-linejoin':'round',...extra});if(dash)poly.setAttribute('stroke-dasharray',dash);g.appendChild(poly);if(hatch&&!n.ghost){g.appendChild(el('polygon',{points:pts(p),fill:'url(#'+hatch+')',style:'color:var(--ink)',stroke:'none'}));}};
  const box=(z0,z1,hatchTop)=>{ face3([P(gx,gy+d,z0),P(gx+w,gy+d,z0),P(gx+w,gy+d,z1),P(gx,gy+d,z1)],face,'hatch'); face3([P(gx+w,gy,z0),P(gx+w,gy+d,z0),P(gx+w,gy+d,z1),P(gx+w,gy,z1)],face,'hatch'); face3([P(gx,gy,z1),P(gx+w,gy,z1),P(gx+w,gy+d,z1),P(gx,gy+d,z1)],face,hatchTop||null); };
  const kind=n.kind||'box';
  if(kind==='store'){ const L=3, gap=3, lh=(h-gap*(L-1))/L; for(let i=0;i<L;i++){ const z0=i*(lh+gap); box(z0,z0+lh,null);} }
  else if(kind==='cards'){ const L=5, lh=h/L; for(let i=0;i<L;i++) box(i*lh,(i+1)*lh,null); }
  else if(kind==='slab'){ box(0,h,'hatchLight'); }
  else if(kind==='screen'){ box(0,h,null); const inset=.3; if(!n.ghost){ const scr=[P(gx+inset,gy+inset,h),P(gx+w-inset,gy+inset,h),P(gx+w-inset,gy+d-inset,h),P(gx+inset,gy+d-inset,h)]; g.appendChild(el('polygon',{points:pts(scr),fill:'var(--paper)',stroke:'var(--ink)','stroke-width':.9})); for(let i=1;i<=3;i++){const a=P(gx+inset+.2,gy+inset+i*.4,h),b=P(gx+w-inset-.4-(i===3?.5:0),gy+inset+i*.4,h);g.appendChild(el('line',{x1:a[0],y1:a[1],x2:b[0],y2:b[1],stroke:'var(--ink)','stroke-width':.8,opacity:.7}));} } }
  else if(kind==='gate'){ box(0,h,null); if(!n.ghost){ const z0=h*.55,z1=h*.75; const band=[[P(gx,gy+d,z0),P(gx+w,gy+d,z0),P(gx+w,gy+d,z1),P(gx,gy+d,z1)],[P(gx+w,gy,z0),P(gx+w,gy+d,z0),P(gx+w,gy+d,z1),P(gx+w,gy,z1)]]; band.forEach(p=>g.appendChild(el('polygon',{points:pts(p),fill:'var(--ink)',opacity:.85,stroke:'none'}))); } }
  else if(kind==='tall'){ box(0,h,null); if(!n.ghost){ // roof ridge line on top to read as "the brain"
      const c=P(gx+w/2,gy+d/2,h); const a=P(gx,gy+d,h),b=P(gx+w,gy,h); g.appendChild(el('line',{x1:a[0],y1:a[1],x2:b[0],y2:b[1],stroke:'var(--ink)','stroke-width':.8,opacity:.5})); } }
  else if(kind==='job'){ box(0,h,'hatchLight'); }
  else { box(0,h,null); }
  const top=[P(gx,gy,h),P(gx+w,gy,h),P(gx+w,gy+d,h),P(gx,gy+d,h)];
  if(sel||hov){ g.appendChild(el('polygon',{points:pts(top),fill:sel?'var(--ink)':'none',opacity:sel?.12:1,stroke:'var(--ink)','stroke-width':sel?2.5:1.8})); }
  if(fresh&&!sel){ g.appendChild(el('polygon',{class:'halo',points:pts([P(gx-.35,gy-.35,0),P(gx+w+.35,gy-.35,0),P(gx+w+.35,gy+d+.35,0),P(gx-.35,gy+d+.35,0)]),fill:'none',stroke:'var(--ink)','stroke-width':1.4,'stroke-dasharray':'4 3'})); }
  const c=P(gx+w/2,gy+d/2,h); const chipW=16;
  g.appendChild(el('rect',{x:c[0]-chipW/2,y:c[1]-8,width:chipW,height:14,fill:sel?'var(--hi-bg)':'var(--paper)',stroke:'var(--ink)','stroke-width':1}));
  const t=el('text',{x:c[0],y:c[1]+3,'text-anchor':'middle','font-size':'9','font-family':'var(--mono)',fill:sel?'var(--hi-fg)':'var(--ink)','font-weight':'600'}); t.textContent=n.code; g.appendChild(t);
  g.addEventListener('mouseenter',e=>{S.hover=n.id;showTip(e,n);renderPanel();render();});
  g.addEventListener('mousemove',e=>moveTip(e));
  g.addEventListener('mouseleave',()=>{S.hover=null;hideTip();renderPanel();render();});
  g.addEventListener('click',e=>{e.stopPropagation();select(n.id);});
  g.addEventListener('dblclick',e=>{e.stopPropagation();if(!n.inside)goInside(n.id);});
  return g;
}

/* ---------------- PACKETS ---------------- */
function initPackets(){ S.packets=[]; const flows=[...new Set(sceneHops.map(h=>h.flow))]; flows.forEach(f=>S.packets.push({flow:f,hop:0,t:0,speed:.5,pause:0})); S.selPacket=null; }
function hopsOf(flow){ return sceneHops.filter(h=>h.flow===flow); }
function drawPackets(){
  const pg=world.querySelector('#pkts'); if(!pg)return; pg.innerHTML='';
  S.packets.forEach((p,i)=>{ const hs=hopsOf(p.flow); const h=hs[p.hop]; if(!h||!h.path)return; const [x,y]=pointAt(h.path,p.t);
    const isSel=S.selPacket===i; const g=el('g',{class:'pkt',style:'cursor:pointer'});
    if(isSel) g.appendChild(el('circle',{cx:x,cy:y,r:11,fill:'none',stroke:'var(--ink)','stroke-width':1.2,'stroke-dasharray':'2 2'}));
    g.appendChild(el('circle',{cx:x,cy:y,r:5.5,fill:'var(--ink)',stroke:'var(--paper)','stroke-width':1.6}));
    if(isSel||S.hoverPacket===i||S.ch<CH.length-1){ const lbl=el('text',{x:x+10,y:y-8,'font-size':'10','font-family':'var(--mono)',fill:'var(--ink)','font-weight':'500'}); lbl.textContent=h.label; g.appendChild(el('rect',{x:x+7,y:y-19,width:h.label.length*6.4+6,height:14,fill:'var(--paper)',stroke:'var(--ink)','stroke-width':.8})); g.appendChild(lbl); }
    g.addEventListener('click',e=>{e.stopPropagation();S.selPacket=i;S.playing=false;syncFlowBtn();renderPanel();drawPackets();});
    g.addEventListener('mouseenter',()=>{S.hoverPacket=i;drawPackets();});
    g.addEventListener('mouseleave',()=>{S.hoverPacket=null;drawPackets();});
    pg.appendChild(g);
  });
}
let last=0;
function tick(ts){ const dt=Math.min(.05,(ts-last)/1000||0); last=ts; tweenTick(); if(S.playing){ S.packets.forEach(p=>advance(p,dt)); drawPackets(); if(S.selPacket!=null) renderPanel(); } requestAnimationFrame(tick); }
function advance(p,dt){ const hs=hopsOf(p.flow); if(!hs.length)return; if(p.pause>0){p.pause-=dt;return;} const h=hs[p.hop]; if(!h||!h.path){p.hop=(p.hop+1)%hs.length;return;} p.t+=dt*p.speed*(320/Math.max(120,h.path.len)); if(p.t>=1){p.t=0;p.hop=(p.hop+1)%hs.length;p.pause=(p.hop===0?1.2:.35);} }
function stepOnce(){ S.playing=false; syncFlowBtn(); let i=S.selPacket??0; const p=S.packets[i]; if(!p)return; const hs=hopsOf(p.flow); p.hop=(p.hop+1)%hs.length; p.t=.5; p.pause=0; S.selPacket=i; drawPackets(); renderPanel(); }
function syncFlowBtn(){ document.getElementById('btnFlow').textContent = S.playing?'‖ Pause':'▸ Play'; }
requestAnimationFrame(tick);

/* ---------------- PANEL ---------------- */
function nodeChip(id){ const n=byId[id]; return `<button class="chip${n.ghost?' ghost':''}" onclick="select('${id}')">${esc(n.code)} · ${esc(n.name)}</button>`; }
function renderPanel(){
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===S.tab));
  if(S.selPacket!=null && S.packets[S.selPacket]){ const p=S.packets[S.selPacket]; const hs=hopsOf(p.flow); const h=hs[p.hop];
    const A=sceneNodes.find(n=>n.id===h.from), B=sceneNodes.find(n=>n.id===h.to); const flowName=p.flow==='ch'?CH[S.ch].title:p.flow==='inside'?'inside '+byId[S.inside].name:(FLOWS.find(f=>f.id===p.flow)||{}).name;
    body.innerHTML=`<div class="eyebrow">Data packet · ${esc(flowName)} · hop ${p.hop+1} of ${hs.length}</div><h1 class="t">${esc(h.label)}</h1>
    <div class="pk"><div class="lbl">Route</div><div class="route">${esc(A.code)} ${esc(A.name)} &nbsp;→&nbsp; ${esc(B.code)} ${esc(B.name)}</div><div class="lbl">Payload (representative)</div><pre>${esc(JSON.stringify(h.payload,null,2))}</pre></div>
    <p>Payload shapes are what the design implies, not measured traffic.</p>
    <div class="actions"><button class="ctl" onclick="stepOnce()">Trace one step</button><button class="ctl" onclick="S.selPacket=null;S.playing=true;syncFlowBtn();renderPanel();drawPackets()">Release & play</button><button class="ctl" onclick="select('${esc(B.id)}')">Open ${esc(B.code)}</button></div>`; return; }
  const id=S.selected??S.hover; const n=id?sceneNodes.find(x=>x.id===id):null;
  if(!n){ renderChapterPanel(); return; }
  if(n.inside){ const parent=byId[S.inside]; const i=+n.id.slice(1);
    body.innerHTML=`<div class="eyebrow">Inside ${esc(parent.code)} · ${esc(parent.name)} · step ${i+1} of ${parent.steps.length}</div><h1 class="t">${esc(n.name)}</h1><p class="lede">${esc(n.desc)}</p>
    <h3 class="sec">All steps</h3>${parent.steps.map((s,j)=>`<div class="step ${j===i?'cur':''}"><div class="no">${j+1}</div><div class="tx"><b>${esc(s[0])}</b> — ${esc(s[1])}</div></div>`).join('')}
    <div class="actions"><button class="ctl" onclick="comeOut()">← Come back out</button></div>`; return; }
  const status = n.ghost?'<span class="chip ghost static">Not switched on</span>':`<span class="chip static">${n.group==='loop'?'turn loop':n.group==='mem'?'memory':'supporting'}</span>`;
  const pinned=S.selected===n.id;
  let content='';
  if(S.tab==='what') content=`<p class="lede">${n.one}</p><details${pinned?' open':''}><summary>Read more</summary><p>${n.what}</p></details>${n.steps?`<details><summary>Steps in execution</summary>${n.steps.map((s,j)=>`<div class="step"><div class="no">${j+1}</div><div class="tx"><b>${esc(s[0])}</b> — ${esc(s[1])}</div></div>`).join('')}</details>`:''}`;
  else if(S.tab==='how') content=`<p class="lede">${n.one}</p><p>${n.how}</p>`;
  else content=`<p class="lede">${n.one}</p>`+(n.cond&&n.cond.length?qHtml(n.cond):`<p>Nothing open here right now.</p>`);
  body.innerHTML=`<div class="eyebrow">${esc(n.code)} · ${pinned?'pinned':'hovering'}${isNew(n.id)?' · new in this chapter':''}</div><h1 class="t">${esc(n.name)}</h1><div class="sub">${status}</div>${content}
  ${pinned?`<div class="actions">${n.steps?`<button class="ctl" onclick="goInside('${n.id}')">→ Go inside</button>`:''}<button class="ctl" onclick="select(null)">Back to chapter</button></div>`:''}`;
}
function renderChapterPanel(){
  const c=CH[S.ch]; const last=S.ch===CH.length-1;
  if(S.tab==='how'){ body.innerHTML=HOW_HTML; return; }
  if(S.tab==='cond'){ body.innerHTML=`<div class="eyebrow">${esc(TITLE)}</div><h1 class="t">Open questions</h1><div class="sub">${last?'everything unresolved, by structure':'for the structures revealed so far'}</div>`+NODES.filter(n=>revealedIds().includes(n.id)&&n.cond&&n.cond.length).map(n=>`<h3 class="sec">${n.code} · ${esc(n.name)}${n.ghost?' <span class="chip ghost static">later</span>':''}</h3>${qHtml(n.cond)}`).join(''); return; }
  const chips = last ? '' : `<h3 class="sec">New in this chapter</h3><div>${c.reveal.map(nodeChip).join('')}</div>`;
  const nav=`<div class="actions"><button class="ctl" onclick="prevCh()" ${S.ch===0?'disabled':''}>◂ Back</button><button class="ctl primary" onclick="nextCh()" ${last?'disabled':''}>${S.ch===CH.length-2?'Show the whole system ▸':'Next ▸'}</button></div>`;
  body.innerHTML=`<div class="eyebrow">Chapter ${S.ch+1} of ${CH.length}</div><h1 class="t">${esc(c.title)}</h1><p class="lede">${c.lede}</p>${c.story}${chips}${nav}
  ${last?`<h3 class="sec">Decisions locked</h3><ul>${DECISIONS_HTML}</ul>`:''}`;
}
document.querySelectorAll('#tabs button').forEach(b=>b.addEventListener('click',()=>{S.tab=b.dataset.tab;S.selPacket=null;renderPanel();drawPackets();}));

/* ---------------- STATS ---------------- */
function renderStats(){ const el=document.getElementById('stats'); const open=NODES.reduce((a,n)=>a+qOpen(n),0), routed=NODES.reduce((a,n)=>a+(n.cond||[]).filter(c=>c.to).length,0), res=NODES.reduce((a,n)=>a+(n.cond||[]).filter(c=>c.r).length,0);
  const dyn={chapter:`${S.ch+1} / ${CH.length}`, shown:`${revealedIds().length} / ${NODES.length}`, questions:`${open} open · ${routed} routed · ${res} resolved`};
  const all=[...(STATS||[]), {k:'Chapter',v:dyn.chapter},{k:'Structures shown',v:dyn.shown},{k:'Open questions',v:dyn.questions,grow:true}];
  el.innerHTML=all.map(s=>`<div class="stat${s.grow?' grow':''}"><div class="k">${s.k}</div><div class="v">${s.v}</div></div>`).join(''); }

/* ---------------- INDEX + RAIL ---------------- */
function renderIndex(){
  const ix=document.getElementById('index'); ix.innerHTML=''; const rev=new Set(revealedIds());
  GROUPS.forEach(g=>{ const h=document.createElement('h4'); h.textContent=g.title; ix.appendChild(h);
    NODES.filter(n=>n.group===g.id).forEach(n=>{ const b=document.createElement('button'); const shown=rev.has(n.id);
      b.className='ix'+(n.ghost&&shown?' ghost':'')+(!shown?' later':'')+(S.selected===n.id?' on':'')+(isNew(n.id)?' new':''); b.dataset.id=n.id;
      b.innerHTML=`<span class="code">${n.code}</span><span class="nm">${esc(n.name)}</span><span class="n" title="${shown?'open questions':'revealed in chapter'}">${shown?qOpen(n):'ch '+(revealChapterOf(n.id)+1)}</span>`;
      b.addEventListener('click',()=>{ if(!shown){ gotoCh(revealChapterOf(n.id)); select(n.id); return; } if(S.view!=='world')comeOut(); select(n.id); focusNode(n); });
      b.addEventListener('mouseenter',()=>{ if(S.view==='world'&&shown){S.hover=n.id;renderPanel();render();} });
      b.addEventListener('mouseleave',()=>{ if(S.view==='world'){S.hover=null;renderPanel();render();} });
      ix.appendChild(b); }); });
  renderStats();
}
function renderRail(){ const r=document.getElementById('rail'); if(S.view!=='world'){ r.innerHTML=`<span class="title">THE SYSTEM &nbsp;›&nbsp; <b>${esc(byId[S.inside].code)} ${esc(byId[S.inside].name)}</b> &nbsp;·&nbsp; steps in execution</span>`; document.getElementById('flowSel').style.display='none'; return; }
  r.innerHTML=CH.map((c,i)=>`<button class="ch ${i===S.ch?'on':i<S.ch?'done':''} ${i>S.maxCh+1?'locked':''}" title="${esc(c.title)}" onclick="gotoCh(${i})">${i+1}</button>`).join('')+`<span class="title">chapter ${S.ch+1} · <b>${esc(CH[S.ch].title)}</b></span>`;
  const fs=document.getElementById('flowSel'); fs.style.display = S.ch===CH.length-1?'flex':'none';
  if(!fs.dataset.built){ fs.innerHTML=[...FLOWS.map(f=>`<button data-f="${f.id}">${f.name}</button>`),'<button data-f="both">All flows</button>'].join(''); fs.dataset.built='1'; fs.querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{S.flowSel=b.dataset.f;buildWorldScene();initPackets();render();})); }
  fs.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.f===S.flowSel));
  document.getElementById('btnBack').disabled=S.ch===0; document.getElementById('btnNext').disabled=S.ch===CH.length-1;
}

/* ---------------- NAV ---------------- */
function select(id){ S.selected=id; S.selPacket=null; renderIndex(); renderPanel(); render(); }
function gotoCh(i){ i=Math.max(0,Math.min(CH.length-1,i)); if(S.view!=='world'){S.view='world';S.inside=null;} S.ch=i; S.maxCh=Math.max(S.maxCh,i); S.selected=null; S.hover=null; S.tab='what'; buildWorldScene(); initPackets(); S.playing=true; syncFlowBtn(); renderIndex(); render(); renderPanel(); fitView(true); }
function nextCh(){ gotoCh(S.ch+1); } function prevCh(){ gotoCh(S.ch-1); }
function goInside(id){ const n=byId[id]; if(!n||!n.steps)return; S.view='inside'; S.inside=id; S.selected='s0'; buildInsideScene(n); initPackets(); fitView(true); renderIndex(); render(); renderPanel(); }
function comeOut(){ const was=S.inside; S.view='world'; S.inside=null; buildWorldScene(); initPackets(); S.selected=was; fitView(true); renderIndex(); render(); renderPanel(); }
function orderList(){ return S.view==='world'?sceneNodes.map(n=>n.id):sceneNodes.map(n=>n.id); }
document.addEventListener('keydown',e=>{ if(e.target.tagName==='INPUT')return; const L=orderList(); let i=L.indexOf(S.selected);
  if(e.key==='ArrowDown'){e.preventDefault();select(L[Math.min(L.length-1,i+1)]);}
  else if(e.key==='ArrowUp'){e.preventDefault();select(L[Math.max(0,i-1)]);}
  else if(e.key==='ArrowRight'){e.preventDefault(); if(S.view==='world'&&S.selected)goInside(S.selected);}
  else if(e.key==='ArrowLeft'){e.preventDefault(); if(S.view==='inside')comeOut(); else select(null);}
  else if(e.key==='Enter'||e.key===']'){e.preventDefault(); if(S.view==='world')nextCh();}
  else if(e.key==='['){e.preventDefault(); if(S.view==='world')prevCh();}
  else if(e.key===' '){e.preventDefault();toggleFlow();}
  else if(e.key==='Escape'){select(null);} });

/* ---------------- VIEW / PAN / ZOOM ---------------- */
let tween=null;
function applyView(){ world.setAttribute('transform',`translate(${S.tx},${S.ty}) scale(${S.k})`); }
function tweenTick(){ if(!tween)return; const now=performance.now(); let u=Math.min(1,(now-tween.t0)/tween.dur); u=1-Math.pow(1-u,3); S.tx=tween.a.tx+(tween.b.tx-tween.a.tx)*u; S.ty=tween.a.ty+(tween.b.ty-tween.a.ty)*u; S.k=tween.a.k+(tween.b.k-tween.a.k)*u; applyView(); if(u>=1)tween=null; }
function setView(tx,ty,k,anim){ tween=null; if(anim&&!matchMedia('(prefers-reduced-motion: reduce)').matches){ tween={a:{tx:S.tx,ty:S.ty,k:S.k},b:{tx,ty,k},t0:performance.now(),dur:520}; } else { S.tx=tx;S.ty=ty;S.k=k;applyView(); } }
function bbox(){ let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9; sceneNodes.forEach(n=>{[P(n.gx,n.gy,n.h),P(n.gx+n.w,n.gy,n.h),P(n.gx+n.w,n.gy+n.d,-24),P(n.gx,n.gy+n.d,0),P(n.gx,n.gy,0)].forEach(p=>{x0=Math.min(x0,p[0]);y0=Math.min(y0,p[1]);x1=Math.max(x1,p[0]);y1=Math.max(y1,p[1]);});}); return {x0,y0,x1,y1}; }
function fitView(anim){ const r=svg.getBoundingClientRect(); if(!sceneNodes.length)return; const b=bbox(); const pad=40; const k=Math.min((r.width-pad*2)/Math.max(1,b.x1-b.x0),(r.height-pad*2)/Math.max(1,b.y1-b.y0)); if(r.width<80||r.height<80||!isFinite(k)||k<=0)return; const kk=Math.max(.2,Math.min(k,1.5)); setView(r.width/2-((b.x0+b.x1)/2)*kk, r.height/2-((b.y0+b.y1)/2)*kk+8, kk, anim); }
function focusNode(n){ const r=svg.getBoundingClientRect(); const c=P(n.gx+n.w/2,n.gy+n.d/2,n.h/2); setView(r.width/2-c[0]*S.k, r.height/2-c[1]*S.k, S.k, true); }
function zoomAt(f,cx,cy){ tween=null; const nk=Math.max(.35,Math.min(3,S.k*f)); S.tx=cx-(cx-S.tx)*(nk/S.k); S.ty=cy-(cy-S.ty)*(nk/S.k); S.k=nk; applyView(); }
svg.addEventListener('wheel',e=>{e.preventDefault(); const r=svg.getBoundingClientRect(); zoomAt(e.deltaY<0?1.1:0.9,e.clientX-r.left,e.clientY-r.top);},{passive:false});
let drag=null; svg.addEventListener('pointerdown',e=>{ if(e.button!==0)return; tween=null; drag={x:e.clientX,y:e.clientY,tx:S.tx,ty:S.ty,moved:false}; svg.setPointerCapture(e.pointerId); });
svg.addEventListener('pointermove',e=>{ if(!drag)return; const dx=e.clientX-drag.x,dy=e.clientY-drag.y; if(Math.hypot(dx,dy)>3){drag.moved=true;svg.classList.add('dragging');} S.tx=drag.tx+dx; S.ty=drag.ty+dy; applyView(); });
svg.addEventListener('pointerup',e=>{ if(drag&&!drag.moved){ select(null); } drag=null; svg.classList.remove('dragging'); });
document.getElementById('zin').onclick=()=>{const r=svg.getBoundingClientRect();zoomAt(1.2,r.width/2,r.height/2);};
document.getElementById('zout').onclick=()=>{const r=svg.getBoundingClientRect();zoomAt(1/1.2,r.width/2,r.height/2);};
window.addEventListener('resize',()=>fitView(false));

/* ---------------- TIP ---------------- */
function showTip(e,n){ tip.style.display='block'; tip.textContent=n.inside?n.desc:(n.ghost?'Later · ':'')+n.name+' — '+(n.one||'').replace(/<[^>]+>/g,''); moveTip(e); }
function moveTip(e){ const r=svg.getBoundingClientRect(); let x=e.clientX-r.left+14,y=e.clientY-r.top+14; if(x+290>r.width)x-=300; if(y+60>r.height)y-=70; tip.style.left=x+'px'; tip.style.top=y+'px'; }
function hideTip(){ tip.style.display='none'; }

/* ---------------- CONTROLS ---------------- */
function toggleFlow(){ S.playing=!S.playing; if(S.playing)S.selPacket=null; syncFlowBtn(); renderPanel(); drawPackets(); }
document.getElementById('btnFlow').onclick=toggleFlow;
document.getElementById('btnStep').onclick=stepOnce;
document.getElementById('btnReset').onclick=()=>{ select(null); fitView(true); };
document.getElementById('btnNext').onclick=nextCh; document.getElementById('btnBack').onclick=prevCh;

/* ---------------- BOOT ---------------- */
gotoCh(0);
</script>
